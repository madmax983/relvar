[package]
name = "relvar-storage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Persistent storage layer for Relvar"
keywords = ["database", "storage", "persistence"]
categories = ["database-implementations"]

[features]
default = ["std"]
# `std` keeps the storage layer on the standard library (v0.7 will introduce
# a `no_std` storage HAL; until then this feature documents the requirement).
std = ["serde/std", "thiserror/std"]

[dependencies]
relvar-core.workspace = true
relvar-storage-core.workspace = true
# spin backs the no_std lock shim (crate::sync); it is cfg-gated in code,
# which Cargo's unused-dependencies lint cannot see (allowed below).
spin.workspace = true
thiserror.workspace = true
serde.workspace = true
postcard.workspace = true
serde_json.workspace = true

[lints.cargo]
unused_dependencies = "allow"

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
criterion.workspace = true

[[bench]]
name = "storage"
harness = false

[[bench]]
name = "mvcc"
harness = false
