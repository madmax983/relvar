# Codecov configuration for Relvar
# See: https://docs.codecov.com/docs/codecov-yaml

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: auto
        threshold: 1%
        base: auto
        if_ci_failed: error

    patch:
      default:
        target: 80%
        threshold: 5%
        if_ci_failed: error

comment:
  layout: "header, diff, flags, components, files, footer"
  behavior: default
  require_changes: false

ignore:
  - "benches/**/*"
  - "examples/**/*"
  - "tests/**/*"

component_management:
  default_rules:
    statuses:
      - type: project
        target: 80%
      - type: patch
        target: 80%

  individual_components:
    - component_id: core
      name: Core Database
      paths:
        - src/database/**/*
        - src/storage/**/*

    - component_id: algebra
      name: Relational Algebra
      paths:
        - src/algebra/**/*

    - component_id: constraints
      name: Constraints
      paths:
        - src/constraints/**/*

    - component_id: types
      name: Type System
      paths:
        - src/types/**/*
