[workspace]
resolver = "2"
members = [
    "relvar-core",
    "relvar-storage",
    "relvar-storage-core",
    "relvar",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Mark M"]
license = "MIT"
repository = "https://github.com/yourusername/relvar"

[workspace.dependencies]
# Shared dependencies
thiserror = { version = "2", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
postcard = { version = "1.0", default-features = false, features = ["alloc", "use-std"] }
serde_json = "1"
# no_std-compatible hash maps for relvar-core (foldhash-backed, no std rand needed)
hashbrown = { version = "0.15", default-features = false, features = ["default-hasher", "serde"] }
# Deterministic no_std-compatible hasher for ad-hoc content hashing
# (replaces std's DefaultHasher in new_hasher(); see relvar-core/src/collections.rs)
foldhash = { version = "0.2", default-features = false }

# Dev dependencies
proptest = "1"
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
# Spin locks for the no_std lock abstraction in relvar-storage (crate::sync)
spin = "0.12.3"

# Internal crates
relvar-core = { path = "relvar-core" }
relvar-storage = { path = "relvar-storage" }
relvar-storage-core = { path = "relvar-storage-core" }
