[workspace]
resolver = "2"
members = [
    "relvar-core",
    "relvar-storage",
    "relvar",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Mark M"]
license = "MIT"
repository = "https://github.com/yourusername/relvar"

[workspace.dependencies]
# Shared dependencies
thiserror = "2"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1.0", default-features = false, features = ["alloc", "use-std"] }
serde_json = "1"

# Dev dependencies
proptest = "1"
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }

# Internal crates
relvar-core = { path = "relvar-core" }
relvar-storage = { path = "relvar-storage" }
